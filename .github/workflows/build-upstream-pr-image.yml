name: Build upstream PR image

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Upstream RooCodeInc/Roomote pull request number
        required: true
        default: '964'
        type: string
      expected_head_sha:
        description: Optional full PR head SHA; the build fails if the PR moved
        required: false
        default: '9e614e8784eacb6ff25b4c01da238be7377bf54a'
        type: string
      image_tag:
        description: Mutable GHCR tag to publish
        required: true
        default: 'pr-964'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-upstream-pr-image-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR #${{ inputs.pr_number }} (amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out upstream pull request head
        uses: actions/checkout@v4
        with:
          repository: RooCodeInc/Roomote
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and validate image metadata
        id: vars
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$actual_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR head moved: expected $EXPECTED_HEAD_SHA but checked out $actual_sha" >&2
            exit 1
          fi

          case "$REQUESTED_TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "Invalid Docker tag: $REQUESTED_TAG" >&2
              exit 1
              ;;
          esac

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          short_sha="${actual_sha:0:8}"
          product_version="$(jq -r .version package.json)"
          immutable_tag="${REQUESTED_TAG}-${short_sha}"
          image="ghcr.io/${owner}/roomote-app"

          echo "actual_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "product_version=$product_version" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$immutable_tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Roomote app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/app/Dockerfile
          target: runtime-app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.immutable_tag }}
          build-args: |
            R_APP_ENV=preview
            RELEASE_VERSION=${{ steps.vars.outputs.immutable_tag }}
            RELEASE_PRODUCT_VERSION=${{ steps.vars.outputs.product_version }}
          cache-from: type=gha,scope=roomote-pr-app-amd64
          cache-to: type=gha,mode=max,scope=roomote-pr-app-amd64

      - name: Write build summary
        shell: bash
        run: |
          {
            echo '## Published Roomote PR image'
            echo
            echo '- Upstream PR: `RooCodeInc/Roomote#${{ inputs.pr_number }}`'
            echo '- Head SHA: `${{ steps.vars.outputs.actual_sha }}`'
            echo '- Mutable tag: `${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}`'
            echo '- Immutable tag: `${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.immutable_tag }}`'
          } >> "$GITHUB_STEP_SUMMARY"
